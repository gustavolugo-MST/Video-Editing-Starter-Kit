<!DOCTYPE html>
<html lang="en" data-resolution="landscape" data-composition-variables="[
    {&quot;id&quot;:&quot;title&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Title&quot;,&quot;default&quot;:&quot;Your Video Title&quot;},
    {&quot;id&quot;:&quot;subtitle&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Subtitle&quot;,&quot;default&quot;:&quot;A short tagline goes here&quot;},
    {&quot;id&quot;:&quot;accent&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Accent color&quot;,&quot;default&quot;:&quot;#6366f1&quot;}
  ]">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #stage {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }
      #bar {
        width: 0;
        height: 8px;
        border-radius: 4px;
        background: var(--accent, #6366f1);
      }
      #title {
        color: #f4f4f5;
        font-size: 104px;
        font-weight: 700;
        letter-spacing: -0.035em;
        text-align: center;
        max-width: 88%;
        line-height: 1.05;
      }
      #subtitle {
        color: #a1a1aa;
        font-size: 44px;
        font-weight: 400;
        letter-spacing: -0.01em;
        text-align: center;
        max-width: 80%;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-x3dq" id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <div data-hf-id="hf-1rt5" id="stage">
        <div data-hf-id="hf-2to0" id="bar"></div>
        <h1 data-hf-id="hf-6cy9" id="title">Your Video Title</h1>
        <p data-hf-id="hf-bcm7" id="subtitle">A short tagline goes here</p>
      </div>
    </div>
    <script>
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      if (vars.title) document.getElementById("title").textContent = vars.title;
      if (vars.subtitle) document.getElementById("subtitle").textContent = vars.subtitle;
      if (vars.accent) document.documentElement.style.setProperty("--accent", vars.accent);

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to("#bar", { width: 160, duration: 0.6, ease: "power3.out" }, 0.1)
        .fromTo("#title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.3)
        .fromTo("#subtitle", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.6)
        .to("#stage", { opacity: 0, duration: 0.5, ease: "power2.in" }, 3.5);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
